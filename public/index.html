
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#080d19">
<title>DARK AI - Your AI Assistant</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#080d19;
  color:#fff;
  font-family:Arial,sans-serif;
  height:100dvh;
  display:flex;
  flex-direction:column;
}
header{
  padding:17px;
  background:#111b2d;
  border-bottom:1px solid #29364b;
  display:flex;
  align-items:center;
  gap:12px;
}
.logo{
  width:43px;height:43px;
  background:linear-gradient(135deg,#765cff,#3425ad);
  border-radius:13px;
  display:grid;place-items:center;
  font-size:24px;font-weight:bold;
}
header h2{margin:0;font-size:19px}
header small{color:#9baac5}
#chat{
  flex:1;
  overflow-y:auto;
  padding:18px;
  display:flex;
  flex-direction:column;
  gap:14px;
}
.msg{
  max-width:88%;
  padding:13px 15px;
  border-radius:15px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.user{
  align-self:flex-end;
  background:#5948dc;
}
.bot{
  align-self:flex-start;
  background:#19263b;
  border:1px solid #30405a;
}
#status{
  text-align:center;
  padding:5px;
  color:#91a5c5;
  font-size:12px;
}
footer{
  padding:12px;
  display:flex;
  gap:9px;
  background:#111b2d;
}
input{
  flex:1;
  min-width:0;
  padding:14px;
  border:1px solid #354661;
  border-radius:12px;
  background:#19263b;
  color:white;
  font-size:15px;
  outline:none;
}
button{
  border:0;
  border-radius:12px;
  padding:0 18px;
  background:#6955f5;
  color:white;
  font-weight:bold;
}
button:disabled{opacity:.5}
</style>
</head>

<body>

<header>
  <div class="logo">D</div>
  <div>
    <h2>DARK AI</h2>
    <small>Your Personal AI Assistant</small>
  </div>
</header>

<main id="chat">
  <div class="msg bot">
    Welcome to DARK AI! 👋
    How can I help you today?
  </div>
</main>

<div id="status">Online</div>

<footer>
  <input id="message"
    placeholder="Ask anything..."
    maxlength="4000">
  <button id="send">Send</button>
</footer>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("message");
const send = document.getElementById("send");
const statusText = document.getElementById("status");

let history = [];

function addMessage(text,type){
  const div = document.createElement("div");
  div.className = "msg " + type;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(){
  const message = input.value.trim();

  if(!message || send.disabled) return;

  addMessage(message,"user");
  input.value = "";
  send.disabled = true;
  statusText.textContent = "DARK AI is thinking...";

  try{
    const response = await fetch("/api/chat",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        message,
        history
      })
    });

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.error || "Request failed");
    }

    addMessage(data.reply,"bot");

    history.push(
      {role:"user",text:message},
      {role:"model",text:data.reply}
    );

    history = history.slice(-10);
    statusText.textContent = "Online";

  }catch(error){
    addMessage("Error: "+error.message,"bot");
    statusText.textContent = "Connection error";
  }

  send.disabled = false;
  input.focus();
}

send.addEventListener("click",sendMessage);

input.addEventListener("keydown",event=>{
  if(event.key==="Enter"){
    sendMessage();
  }
});
</script>

</body>
</html>
